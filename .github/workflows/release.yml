name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SSH Server Manager ${{ github.ref_name }}"
          releaseBody: |
            Linux desktop app for managing SSH servers — hosts with an encrypted
            credential vault, tabbed terminals, SFTP file browser, port
            forwarding (local/remote/SOCKS5), health monitoring, and background
            jobs. Pure-Rust SSH stack (russh), no system OpenSSH required.

            **Downloads:** `.AppImage` (portable, most distros), `.deb`
            (Debian/Ubuntu), `.rpm` (Fedora/openSUSE).
          releaseDraft: false
          prerelease: false
